<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <script>
    fetch('utils.jsx').then(r => r.text()).then(code => {
      try {
        Babel.transform(code, { presets: ['react'] });
        console.log("Transpile SUCCESS");
      } catch (e) {
        console.error("Transpile ERROR:", e.message);
      }
    });
  </script>
</body>
</html>
