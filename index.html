  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      font-family: 'GameNums', 'PixelifySans', monospace !important;
    }

    .fa::before,
    .fas::before,
    .far::before,
    .fal::before,
    .fab::before,
    [class^="fa-"]::before,
    [class*=" fa-"]::before {
      font-family: "Font Awesome 6 Free" !important;
    }

    .fab::before,
    [class^="fa-brands"]::before {
      font-family: "Font Awesome 6 Brands" !important;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    #root {
      min-height: 100vh;
    }

    /* Responsive: collapse to single column on small screens */
    @media (max-width: 900px) {
      .gate-hero-wrap {
        grid-template-columns: 1fr !important;
      }

      .gate-hero {
        display: none !important;
      }
    }

    /* Animations */
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% - 60px));
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    @keyframes goldFloat {
      0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
      50% { transform: translate(-50%, -50%) translateY(-10px); }
    }

    @keyframes auroraMove {
      0% { background-position: 0% 50%; transform: scale(1) rotate(0deg); }
      50% { background-position: 100% 50%; transform: scale(1.1) rotate(2deg); }
      100% { background-position: 0% 50%; transform: scale(1) rotate(0deg); }
    }

    .aurora-container {
      position: absolute;
      inset: -20%;
      background: linear-gradient(
        135deg,
        rgba(0, 255, 150, 0.3),
        rgba(0, 160, 255, 0.3),
        rgba(180, 70, 255, 0.3),
        rgba(0, 255, 200, 0.3)
      );
      background-size: 300% 300%;
      filter: blur(60px);
      animation: auroraMove 30s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: var(--aurora-opacity, 0);
      transition: opacity 2s ease-in-out;
    }

    @keyframes goldSpin {
      0% {
        filter: drop-shadow(0 0 8px #FFC22060) hue-rotate(0deg);
      }

      100% {
        filter: drop-shadow(0 0 8px #FFC22060) hue-rotate(30deg);
      }
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes cursorBlink {

      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }

    @keyframes dangerPulse {

      0%,
      100% {
        box-shadow: 0 0 32px oklch(0.6 0.25 25 / 0.5), 0 6px 24px rgba(0, 0, 0, 0.25);
      }

      50% {
        box-shadow: 0 0 48px oklch(0.65 0.28 25 / 0.8), 0 6px 24px rgba(0, 0, 0, 0.3);
      }
    }

    @keyframes floatMini {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    @keyframes rotateSun {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--neutral-i020);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--neutral-i030);
    }

    @keyframes clickPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(0, 0) scale(0.6);
      }

      20% {
        opacity: 1;
        transform: translate(-50%, -50%) translate(calc(var(--tx) * 0.2), -30px) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--tx), 60px) scale(0.8);
      }
    }

    @keyframes toothPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(0, 0) scale(0.6) rotate(0deg);
      }

      12% {
        opacity: 1;
        transform: translate(-50%, -50%) translate(calc(var(--tx) * 0.15), -60px) scale(1) rotate(var(--rot));
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--tx), 220px) scale(0.8) rotate(calc(var(--rot) * 3));
      }
    }

    @keyframes toothClick {
      0% {
        transform: scale(0.9);
      }

      100% {
        transform: scale(1);
      }
    }

    /* Security: Prevent selection and dragging */
    * {
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    @keyframes modalOut {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-3px);
      }

      75% {
        transform: translateX(3px);
      }
    }
  </style>

  <script>
    window.onerror = function (msg, url, line, col, error) {
      var errDiv = document.createElement('div');
      errDiv.style.color = 'red';
      errDiv.style.background = 'white';
      errDiv.style.padding = '20px';
      errDiv.style.position = 'absolute';
      errDiv.style.top = '0';
      errDiv.style.zIndex = '999999';
      errDiv.innerText = 'Error: ' + msg + '\nURL: ' + url + '\nLine: ' + line + '\nStack: ' + (error ? error.stack : '');
      document.body.appendChild(errDiv);
      return false;
    };
  </script>

  <script>
    // Block common DevTools and saving shortcuts
    document.addEventListener('keydown', function (e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.key === 'K')) ||
        (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P')) ||
        (e.metaKey && e.altKey && e.key === 'i') // Mac shortcut
      ) {
        e.preventDefault();
        return false;
      }
    });

    // Ensure images are not draggable even if dynamically added
    document.addEventListener('dragstart', function (e) {
      if (e.target.nodeName === 'IMG') e.preventDefault();
    });
  </script>

  <script>
    // Prevent zooming on mobile
    document.addEventListener('touchstart', function (event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchmove', function (event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });
    
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    document.addEventListener('gesturestart', function (event) {
      event.preventDefault();
    });

    // Disable zoom via wheel + ctrl
    document.addEventListener('wheel', function (event) {
      if (event.ctrlKey) {
        event.preventDefault();
      }
    }, { passive: false });
  </script>
